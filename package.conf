# Changedetection.io on the DSM app chassis. Read by chassis/build.sh and the tests.
PKG_NAME=changedetection
PKG_TITLE="Changedetection.io"
PKG_DESC="Changedetection.io, the self-hosted website change monitor, in Container Manager — with a DSM window for your watches, DSM notifications and ntfy alerts when a page changes, password protection, an optional browser for JavaScript-heavy pages, backups and updates."
APP_ID="Changedetection.AppInstance"
REPO=tombruton87/changedetection-dsm
SERVICES="server"            # the browser (compose profile "browser") is optional and watched by app.sh
VOLUMES="data"
IMAGE_VARS="CD_IMAGE"
PORT=5090
PORTS="5090 5091 5095 5190"
HEALTH_PATH=/
APP_ACTIONS="watchadd|watchcheck|checkall|watchpause|watchresume|lanpages|browser|dsmnotify|dsmtest|noteadd|notedel|notetest|ntfyuse|pwnew|pwset|pwoff"
APP_ANSWER_KEYS="USE_BROWSER PROTECT"
APP_REQUEST_KEYS="WATCH_ID URL_B64 TITLE_B64 VIA_BROWSER NOTIFY NOTE_ID NOTE_B64 TOPIC PASS_B64"
TAGLINE="website change monitor"
WELCOME="Changedetection.io watches web pages for you and tells you when they change — prices, stock, news, documents, job listings, anything with a URL. This package runs it in Container Manager, protects it with a password, and adds a Changedetection.io window to DSM with your watches, DSM notifications and ntfy alerts."
BACKUP_WHAT="every watch with its history of snapshots and screenshots, tags, notification settings and the password."
SITE_NOTE="Changedetection.io serves plain HTTP on this port, which is fine on your own network. The address here goes into the links in its notifications. For use away from home, put it behind DSM's reverse proxy with HTTPS (steps below) and tick the box."
ICON_TOP="#3a5fb4"
ICON_BOTTOM="#6a48ac"
ICON_LETTER="C"   # only if icon.png is missing
BETA=yes
